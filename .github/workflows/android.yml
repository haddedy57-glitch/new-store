name: Build New Store APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NewStore.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: New Store Android v1.0.${{ github.run_number }}
          files: NewStore.apk
          make_latest: true
          generate_release_notes: true
